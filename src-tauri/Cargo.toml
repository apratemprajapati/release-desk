[package]
name = "release-desk"
version = "0.1.0"
description = "Multi-project release GUI: commit, push, bump, notes, tag, GitHub release"
edition = "2021"
license = "MIT"

[lib]
name = "release_desk"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "release-desk"
path = "src/main.rs"
required-features = ["app"]

[features]
# `app` pulls in Tauri and the OS keychain. The core (git, version, notes,
# github, pipeline, store) builds and tests without it.
default = ["app"]
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:keyring"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
semver = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
once_cell = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
